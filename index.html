<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Awale Project - Modern Portfolio Website">
    <title>Awale Project | Kylian Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* Styles pour l'image de fond Kylian */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #0f0f0f; /* Fond sombre par défaut */
        }

        .kylian-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* L'image est ici */
            background-image: url('kylian.png'); 
            background-repeat: no-repeat;
            background-position: center;
            /* "contain" permet de voir toute l'image sans zoom. 
               Change en "cover" si tu veux qu'elle remplisse tout l'écran */
            background-size: contain; 
            z-index: -2;
        }

        /* Overlay pour rendre le texte lisible */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Ajuste l'opacité ici (0.5 = 50%) */
            z-index: -1;
        }

        /* Amélioration des cartes de skills */
        .skill-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            color: white;
        }

        .skill-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 255, 200, 0.2);
            border-color: #00ffc8;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #00ffc8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="kylian-bg"></div>
    <div class="overlay"></div>

    <div id="loader" class="loader">
        <div class="loader-bar-container">
            <div class="loader-bar"></div>
        </div>
        <p style="color: white; text-align: center; margin-top: 20px;">Chargement du projet...</p>
    </div>

    <div id="main-content" class="main-content-wrapper">
        
        <button class="menu-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
        </button>

        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" class="nav-link" data-tab="hub"><i class="fas fa-home"></i> Hub</a></li> 
                    <li><a href="#" class="nav-link" data-tab="skills-booster"><i class="fas fa-rocket"></i> Skills</a></li>
                    <li><a href="https://github.com/" target="_blank" class="nav-link"><i class="fab fa-github"></i> GitHub</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content" id="page-content">
            <section id="hub" class="tab-content">
                <h1 class="main-title">Awale Project</h1>
                <p class="subtitle">Le futur du design, inspiré par Kylian.</p>
                <div style="margin-top: 30px;">
                    <button class="btn-primary" style="padding: 10px 25px; border-radius: 25px; border: none; background: #00ffc8; font-weight: bold; cursor: pointer;">Explorer</button>
                </div>
            </section>
            
            <section id="skills-booster" class="tab-content hidden">
                <h1 class="main-title">Skills Booster</h1>
                <div class="skills-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px;">
                    <div class="skill-card">
                        <i class="fas fa-code fa-2x"></i>
                        <h3>Développement</h3>
                        <p>HTML5, CSS3, JS Modernes.</p>
                    </div>
                    <div class="skill-card">
                        <i class="fas fa-bolt fa-2x"></i>
                        <h3>Performance</h3>
                        <p>Optimisation fluide et rapide.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Script simple pour le loader et les onglets
        window.addEventListener('load', () => {
            document.getElementById('loader').style.display = 'none';
        });

        const links = document.querySelectorAll('.nav-link[data-tab]');
        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const tabId = link.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
                document.getElementById(tabId).classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
