<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awale Project | Premium Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --primary: #00ffc8;
            --bg-dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow-x: hidden;
        }

        /* Arrière-plan optimisé */
        .kylian-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('kylian.png') no-repeat center center;
            background-size: cover; /* "cover" est souvent plus pro que "contain" */
            z-index: -2;
            filter: brightness(0.6);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, var(--bg-dark) 100%);
            z-index: -1;
        }

        /* Conteneur Principal */
        .main-content-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Stylisée */
        .sidebar {
            width: 80px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            transition: width 0.3s ease;
        }

        .nav-link {
            color: rgba(255,255,255,0.6);
            font-size: 1.5rem;
            margin-bottom: 30px;
            transition: 0.3s;
            text-decoration: none;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        /* Zone de contenu */
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 60px;
            border-radius: 30px;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .main-title {
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to bottom, #fff 40%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin: 20px 0 40px;
            letter-spacing: 1px;
        }

        /* Boutons */
        .btn-primary {
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            background: var(--primary);
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--primary);
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .skill-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .skill-card:hover {
            background: rgba(0, 255, 200, 0.05);
            border-color: var(--primary);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="kylian-bg"></div>
    <div class="overlay"></div>

    <div class="main-content-wrapper">
        <aside class="sidebar">
            <a href="#" class="nav-link active" data-tab="hub"><i class="fas fa-home"></i></a> 
            <a href="#" class="nav-link" data-tab="skills-booster"><i class="fas fa-rocket"></i></a>
            <a href="https://github.com/" target="_blank" class="nav-link"><i class="fab fa-github"></i></a>
        </aside>

        <main class="content">
            <section id="hub" class="tab-content glass-panel">
                <h1 class="main-title">AWALE<br>PROJECT</h1>
                <p class="subtitle">L'excellence au service du design digital.</p>
                <button class="btn-primary">Commencer l'expérience</button>
            </section>
            
            <section id="skills-booster" class="tab-content glass-panel hidden">
                <h2 style="font-size: 2.5rem; margin-bottom: 30px;">Compétences</h2>
                <div class="skills-grid">
                    <div class="skill-card">
                        <i class="fas fa-code fa-2x" style="color: var(--primary);"></i>
                        <h3>Architecture</h3>
                        <p>Structure propre et code optimisé.</p>
                    </div>
                    <div class="skill-card">
                        <i class="fas fa-bolt fa-2x" style="color: var(--primary);"></i>
                        <h3>Rapidité</h3>
                        <p>Temps de réponse ultra-performants.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const links = document.querySelectorAll('.nav-link[data-tab]');
        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Gérer les classes actives
                links.forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                // Gérer l'affichage des sections
                const tabId = link.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
                document.getElementById(tabId).classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
